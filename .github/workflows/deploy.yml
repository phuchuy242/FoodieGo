name: Deploy E-Menu & Admin to GitHub Pages

on:
  # Runs on pushes targeting main branch only
  push:
    branches: ["main"]

  # Allows running this workflow manually from the Actions tab on GitHub
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"
          cache-dependency-path: ./frontend/*/package-lock.json

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Install E-Menu dependencies
        working-directory: ./frontend/emenu
        run: npm install --legacy-peer-deps

      - name: Build E-Menu project
        working-directory: ./frontend/emenu
        run: npm run build

      - name: Install Admin dependencies
        working-directory: ./frontend/admin
        run: npm install --legacy-peer-deps

      - name: Build Admin project
        working-directory: ./frontend/admin
        run: npm run build

      - name: Prepare combined deployment artifact
        run: |
          mkdir -p ./deploy_dist/admin
          cp -r ./frontend/emenu/dist/* ./deploy_dist/
          cp -r ./frontend/admin/build/* ./deploy_dist/admin/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./deploy_dist

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
